name: 📦 Dependency Report & Notify

# Read-only version check for internal apps and tools: language runtimes (go directive,
# Dockerfile base images like golang/node/python), frameworks and libraries. Renovate runs in
# dryRun=lookup mode: it clones, extracts and looks up newer versions, but never opens issues,
# PRs or branches — so forks we don't own are safe to scan. The result is a JSON report
# summarized to Telegram, same idea as ops-github-runner-check-updates.yml. Also dispatchable
# on demand from Telegram via automation-hub (/run_dependency_report).
#
# This repo is PUBLIC, and so are its Actions logs and artifacts. The scanned repo list comes
# from Infisical and includes private repos, so nothing repo-specific may reach the log:
# - every repo name is masked as soon as it's fetched,
# - Renovate's output goes to a file, never to stdout; on failure its tail goes to Telegram,
# - the report is never uploaded as an artifact (public repo artifacts are downloadable).

on:
  schedule:
    # Mondays 14:15 UTC (~9:15 AM GMT-5). Non-top-of-hour minute to dodge scheduler congestion.
    - cron: '15 14 * * 1'
  workflow_dispatch:

env:
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:44.151.0

jobs:
  report:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # required to request a GitHub OIDC token for Infisical
    steps:
      # Expected secrets at /dependency-report:
      # - RENOVATE_TOKEN: fine-grained PAT, read-only on the scanned repos
      # - DEPENDENCY_REPORT_REPOSITORIES: JSON array, e.g. ["devidence-dev/automation-hub"]
      # - DEPENDENCY_REPORT_FORKS: JSON array, subset of the above tagged "fork" in the message
      # - TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID: Infisical references to /cross
      - name: 🔐 Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          identity-id: "77942652-da93-4daa-9f33-62534699496b"
          domain: "https://app.infisical.com"
          project-slug: "homelab-devidence"
          env-slug: "prod"
          secret-path: "/dependency-report"
          export-type: "env"

      - name: 🙈 Mask repository names
        run: |
          set -euo pipefail
          # The action masks each secret as a whole string; a single repo name printed on its
          # own (owner/name or bare name) wouldn't match that, so mask each piece too.
          jq -r '.[] | ., (split("/")[1])' <<<"$DEPENDENCY_REPORT_REPOSITORIES" | while IFS= read -r name; do
            echo "::add-mask::$name"
          done

      - name: 🔍 Renovate lookup (dry run)
        id: renovate
        run: |
          set -euo pipefail
          mkdir -p out
          # ponytail: the Renovate image runs as uid 12021, not the runner's uid; world-writable
          # throwaway dir on an ephemeral hosted runner is the simplest way to get the report out.
          chmod 0777 out
          if docker run --rm \
            -v "$PWD/out:/out" \
            -e RENOVATE_TOKEN \
            -e RENOVATE_PLATFORM=github \
            -e RENOVATE_REPOSITORIES="$DEPENDENCY_REPORT_REPOSITORIES" \
            -e RENOVATE_DRY_RUN=lookup \
            -e RENOVATE_ONBOARDING=false \
            -e RENOVATE_REQUIRE_CONFIG=ignored \
            -e RENOVATE_REPORT_TYPE=file \
            -e RENOVATE_REPORT_PATH=/out/report.json \
            -e LOG_LEVEL=info \
            "$RENOVATE_IMAGE" > out/renovate.log 2>&1; then
            echo "✅ Renovate finished"
          else
            echo "❌ Renovate failed — log tail sent to Telegram (not printed here: public repo)"
            exit 1
          fi

      - name: 📱 Send summary to Telegram
        run: |
          set -euo pipefail
          # One message per repo with pending major/minor/patch updates; 🔴 marks deps with a
          # major available. Lines capped at 40 per repo to stay under Telegram's 4096-char limit.
          jq -c --argjson forks "$DEPENDENCY_REPORT_FORKS" '
            def esc: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
            def real: [.updates[]? | select(.updateType | IN("major","minor","patch"))];
            .repositories | to_entries[] | .key as $repo | .value as $r
            | [ ($r.packageFiles // {})[][] | .deps[]
                | select(real | length > 0)
                | "\(if any(real[]; .updateType == "major") then "🔴" else "🟡" end) <code>\(.depName // "?" | esc)</code> \(.currentVersion // .currentValue // "?" | esc) → \([real[] | "\(.newVersion // .newValue | esc) (\(.updateType))"] | join(", "))"
              ] | unique as $lines
            | ([$r.problems[]? | select(.level >= 50)] | length) as $errors
            | select(($lines | length) > 0 or $errors > 0)
            | [ "<b>📦 \($repo | esc)</b>\(if $forks | index($repo) then " (fork, solo informativo)" else "" end)",
                (if $r.libYearsWithStatus then "\($r.libYearsWithStatus.dependencyStatus.outdated)/\($r.libYearsWithStatus.dependencyStatus.total) desactualizadas · \($r.libYearsWithStatus.libYears.total * 10 | round / 10) libyears" else empty end),
                (if $errors > 0 then "⚠️ \($errors) errores en el scan" else empty end),
                "",
                ($lines[0:40][]),
                (if ($lines | length) > 40 then "… y \(($lines | length) - 40) más" else empty end)
              ] | join("\n")
          ' out/report.json > messages.jsonl

          if [ ! -s messages.jsonl ]; then
            echo '"✅ Dependency report: todo al día."' > messages.jsonl
          fi

          while IFS= read -r msg; do
            curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "disable_web_page_preview=true" \
              --data-urlencode "text=$(jq -r . <<<"$msg")"
          done < messages.jsonl
          echo "✅ Sent $(wc -l < messages.jsonl) message(s)"

      - name: 🚨 Send failure log to Telegram
        if: failure()
        run: |
          # Log tail goes to the private chat instead of the public run log.
          LOG_TAIL=$(tail -n 30 out/renovate.log 2>/dev/null | tail -c 3500 || true)
          curl -fsS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Dependency report falló (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          ${LOG_TAIL:-sin log de Renovate}"
