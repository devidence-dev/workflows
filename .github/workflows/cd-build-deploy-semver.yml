name: 🔁 Reusable — Build, Push & Deploy (semver)

on:
  workflow_call:
    inputs:
      app_name:
        description: "App name, used for git tag/commit messages and as the default GHCR image name."
        required: true
        type: string
      image_name:
        description: "GHCR image name, if different from app_name (e.g. a PascalCase repo name that publishes a lowercase image)."
        required: false
        type: string
        default: ""
      dockerfile_path:
        description: "Path to the Dockerfile, relative to the repo root."
        required: false
        type: string
        default: "Dockerfile"
      build_args:
        description: "Newline-separated KEY=VALUE pairs, each passed as a --build-arg."
        required: false
        type: string
        default: ""
      inject_version_and_date_build_args:
        description: "If true, also pass --build-arg VERSION=<tag without the leading v> and --build-arg DATE_CREATED=<build-time UTC timestamp>. These depend on the tag this workflow itself calculates, so the caller cannot precompute them into build_args like it can for e.g. a language version read from a repo file."
        required: false
        type: boolean
        default: false
      values_path:
        description: "Path to the app's values.yaml inside the homelab repo."
        required: true
        type: string
      sed_anchor_repository:
        description: "If set, anchors the tag/digest sed to this GHCR repository line (regex-escaped by the caller, e.g. 'ghcr\\.io\\/devidence-dev\\/app-name') instead of a global sed — required when values.yaml has more than one repository:/tag: pair (multi-container apps, extra initContainers)."
        required: false
        type: string
        default: ""
      bump:
        description: "patch | minor | major | rebuild (ignored when custom_tag is set)."
        required: false
        type: string
        default: "patch"
      custom_tag:
        description: "Custom tag (e.g. v1.2.3). Overrides the automatic bump when set."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as a prerelease? Ignored on a rebuild."
        required: false
        type: boolean
        default: false
      use_production_environment:
        description: "If true (default), the deploy job runs under environment: production and fetches HOMELAB_DEPLOY_TOKEN from the caller's own secret. If false, no environment is set and the token is fetched via Infisical/OIDC instead — for apps whose Infisical machine identity trust breaks under an environment's OIDC sub claim."
        required: false
        type: boolean
        default: true
    secrets:
      HOMELAB_DEPLOY_TOKEN:
        required: false

jobs:
  # ==========================================
  # 🏷️ Calculate SemVer version
  # ==========================================
  version:
    name: 🏷️ Calculate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      is_rebuild: ${{ steps.semver.outputs.is_rebuild }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Calculate semver tag
        id: semver
        env:
          CUSTOM_TAG: ${{ inputs.custom_tag }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          IS_REBUILD="false"

          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
            [[ "$TAG" == v* ]] || TAG="v$TAG"
          else
            LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            [ -z "$LATEST" ] && LATEST="v0.0.0"

            BUMP_TYPE="$BUMP"
            [ -z "$BUMP_TYPE" ] && BUMP_TYPE="patch"

            if [ "$BUMP_TYPE" = "rebuild" ]; then
              # Reuse the published tag — there is no new version to calculate.
              TAG="$LATEST"
              IS_REBUILD="true"
            else
              MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
              MINOR=$(echo "$LATEST" | cut -d. -f2)
              PATCH=$(echo "$LATEST" | cut -d. -f3)

              case "$BUMP_TYPE" in
                major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
                minor) MINOR=$((MINOR+1)); PATCH=0 ;;
                patch) PATCH=$((PATCH+1)) ;;
              esac

              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          # A prerelease always requires a new tag, so it cannot be combined with a
          # rebuild (which reuses the existing tag by definition) and is ignored then.
          if [ "$PRERELEASE" = "true" ] && [ "$IS_REBUILD" != "true" ]; then
            TAG="${TAG}-pre.$(date +%Y%m%d%H%M%S)"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_rebuild=$IS_REBUILD" >> "$GITHUB_OUTPUT"
          echo "Calculated version: $TAG (rebuild=$IS_REBUILD)"

  # ==========================================
  # 🏗️ Build and push image + create Git tag
  # ==========================================
  build:
    name: 🏗️ Build & Push image
    needs: version
    runs-on: self-hosted
    permissions:
      contents: write
      id-token: write # required so this job can request a GitHub OIDC token for Infisical
    env:
      IMAGE: ${{ inputs.image_name != '' && inputs.image_name || inputs.app_name }}
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔐 GHCR login
        # Not a local ./path: this job checks out the caller app's repo (e.g. automation-hub),
        # not this workflows repo, so the composite action must be fetched by full reference.
        # Pinned to the same tag as this workflow itself — bump both together.
        uses: devidence-dev/workflows/cd/steps/ghcr-login@v1

      - name: Build image
        env:
          TAG: ${{ needs.version.outputs.tag }}
          DOCKERFILE: ${{ inputs.dockerfile_path }}
          BUILD_ARGS: ${{ inputs.build_args }}
          INJECT_VERSION_AND_DATE: ${{ inputs.inject_version_and_date_build_args }}
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')

          ARGS=()
          if [ -n "$BUILD_ARGS" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && ARGS+=(--build-arg "$line")
            done <<< "$BUILD_ARGS"
          fi
          if [ "$INJECT_VERSION_AND_DATE" = "true" ]; then
            ARGS+=(--build-arg "VERSION=${TAG#v}")
            ARGS+=(--build-arg "DATE_CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ')")
          fi

          docker build \
            "${ARGS[@]}" \
            --platform "linux/${ARCH}" \
            -f "$DOCKERFILE" \
            -t "ghcr.io/devidence-dev/${IMAGE}:${TAG}" \
            .

      - name: Push to GHCR
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: docker push "ghcr.io/devidence-dev/${IMAGE}:${TAG}"

      - name: Resolve pushed image digest
        id: digest
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/devidence-dev/${IMAGE}:${TAG}" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.email "ci@devidence.dev"
          git config user.name "homelab-ci"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists (expected on a rebuild), not recreating."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  # ==========================================
  # 🚀 Deploy to production — two variants, same steps
  # ==========================================
  # A job calling a reusable workflow (`uses:`) cannot itself set `environment:` (confirmed
  # against GitHub's docs + actionlint), so whether to gate under `environment: production` has
  # to be decided in here, not by the caller. Most apps want the gate and fetch
  # HOMELAB_DEPLOY_TOKEN as a plain repo secret; at least one app must NOT run under an
  # environment (it changes the OIDC `sub` claim and breaks its Infisical machine identity
  # match) and instead fetches the token via Infisical/OIDC. Both variants call the same
  # composite action so the actual deploy logic isn't duplicated.
  deploy:
    name: 🚀 Deploy to production
    if: inputs.use_production_environment
    needs: [version, build]
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
    steps:
      - name: Bump homelab
        uses: devidence-dev/workflows/cd/steps/homelab-deploy@v1
        with:
          homelab_deploy_token: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          tag: ${{ needs.version.outputs.tag }}
          digest: ${{ needs.build.outputs.digest }}
          is_rebuild: ${{ needs.version.outputs.is_rebuild }}
          values_path: ${{ inputs.values_path }}
          app_name: ${{ inputs.app_name }}
          sed_anchor_repository: ${{ inputs.sed_anchor_repository }}

  deploy-no-environment:
    name: 🚀 Deploy to production (no environment)
    if: ${{ !inputs.use_production_environment }}
    needs: [version, build]
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write # required to request a GitHub OIDC token for Infisical
    steps:
      - name: Fetch HOMELAB_DEPLOY_TOKEN from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          identity-id: "77942652-da93-4daa-9f33-62534699496b"
          domain: "https://app.infisical.com"
          project-slug: "homelab-devidence"
          env-slug: "prod"
          secret-path: "/cross"
          export-type: "env"

      - name: Bump homelab
        uses: devidence-dev/workflows/cd/steps/homelab-deploy@v1
        with:
          homelab_deploy_token: ${{ env.HOMELAB_DEPLOY_TOKEN }}
          tag: ${{ needs.version.outputs.tag }}
          digest: ${{ needs.build.outputs.digest }}
          is_rebuild: ${{ needs.version.outputs.is_rebuild }}
          values_path: ${{ inputs.values_path }}
          app_name: ${{ inputs.app_name }}
          sed_anchor_repository: ${{ inputs.sed_anchor_repository }}
