name: 🧪 Reusable — Node CI

on:
  workflow_call:
    inputs:
      bun_version:
        description: "Bun version to install."
        required: false
        type: string
        default: "latest"
      run_lint:
        description: "Run `bun run lint`. Disable if the repo doesn't define that script yet."
        required: false
        type: boolean
        default: true
      run_check:
        description: "Run `bun run check` (type-check). Disable if the repo doesn't define that script yet."
        required: false
        type: boolean
        default: true
      run_test:
        description: "Run `bun run test`. Disable if the repo doesn't define that script yet."
        required: false
        type: boolean
        default: true
      run_build:
        description: "Run `bun run build`. Disable if the repo doesn't define that script yet."
        required: false
        type: boolean
        default: true

jobs:
  # Each job below is independent and runs in parallel — none `needs:` another. `ci-ok` is the
  # exception (it only aggregates results).

  lint:
    name: 🧹 Lint
    if: inputs.run_lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devidence-dev/workflows/ci/node/steps/setup@v2
        with:
          bun-version: ${{ inputs.bun_version }}
      - uses: devidence-dev/workflows/ci/node/steps/lint@v2

  check:
    name: 🔍 Type-check
    if: inputs.run_check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devidence-dev/workflows/ci/node/steps/setup@v2
        with:
          bun-version: ${{ inputs.bun_version }}
      - uses: devidence-dev/workflows/ci/node/steps/check@v2

  test:
    name: 🧪 Test
    if: inputs.run_test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devidence-dev/workflows/ci/node/steps/setup@v2
        with:
          bun-version: ${{ inputs.bun_version }}
      - uses: devidence-dev/workflows/ci/node/steps/test@v2

  build:
    name: 🏗️ Build verification
    if: inputs.run_build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: devidence-dev/workflows/ci/node/steps/setup@v2
        with:
          bun-version: ${{ inputs.bun_version }}
      - uses: devidence-dev/workflows/ci/node/steps/build@v2

  secrets:
    name: 🔑 Betterleaks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed in a later commit is still leaked
      - uses: devidence-dev/workflows/ci/steps/secret-scan@v2

  ci-ok:
    name: ✅ CI OK
    # The only check a repo's ruleset requires — adding a job above never means editing every
    # repo's ruleset, just this `needs:` list. always(): without it a failed dependency makes this
    # job "skipped", and a skipped required check counts as passing.
    if: always()
    needs: [lint, check, test, build, secrets]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
