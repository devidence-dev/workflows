name: "GNOME extension GLSL"
description: "Installs glslang-tools and runs the repo's own GLSL validation script (npm run glsl)"

runs:
  using: "composite"
  steps:
    - name: Install glslang-tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends glslang-tools

    - name: npm run glsl
      shell: bash
      run: npm run glsl
