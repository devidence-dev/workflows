name: "GNOME extension release"
description: "Creates a GitHub Release for the given tag with dist/*.shell-extension.zip attached; the caller has already validated the tag and checked it is new"

inputs:
  token:
    description: "GitHub token with contents: write (pass `${{ github.token }}`; composite actions cannot default to it)"
    required: true
  tag:
    description: "Release tag (vX.Y.Z), created by the release at the current commit"
    required: true
  prerelease:
    description: "Mark the release as a prerelease (true/false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Create the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        shopt -s nullglob
        zips=(dist/*.shell-extension.zip)
        if [ ${#zips[@]} -ne 1 ]; then
          echo "::error::expected exactly one dist/*.shell-extension.zip, found ${#zips[@]}"
          exit 1
        fi
        args=()
        [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
        gh release create "$TAG" "${zips[0]}" --title "$TAG" --generate-notes --target "$GITHUB_SHA" "${args[@]}"
