name: "Go mod tidy check"
description: "Verifies downloaded modules match go.sum and that go.mod/go.sum are tidy"

runs:
  using: "composite"
  steps:
    - name: Verify modules
      shell: bash
      run: go mod verify

    - name: Check go.mod/go.sum are tidy
      shell: bash
      run: |
        go mod tidy
        if ! git diff --exit-code go.mod go.sum; then
          echo "::error::go.mod or go.sum are not tidy — run 'go mod tidy' and commit."
          exit 1
        fi
